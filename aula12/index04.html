<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 12 HTML</title>
</head>
<body>
    <!-- Utilizando formulários no HTML  -->

    <h2>Exemplo de formulários no HTML</h2>

    <form>
        <label for="p-nome">Primeiro nome</label> <br>
        <input type="text" name="p-nome" id="p-nome"><br>
        <label for="">Segundo nome</label> <br>
        <input type="text" name="s-nome" id="s-nome"><br><br>
        <button type="submit">Enviar</button>

    </form>

    <hr>

    <h2>Exemplo de input type radio (botão de opções)</h2>

    <form>
        <input type="radio" name="linguagem-fav" id="1-html" value="HTML">
        <label for="1-html">HTML</label> <br>
        <input type="radio" name="linguagem-fav" id="1-css" value="CSS">
        <label for="1-css">CSS</label> <br>
        <input type="radio" name="linguagem-fav" id="1-js" value="JavaScript">
        <label for="1-js">JavaScript</label>
    </form>

    <hr>

    <h2>Exemplo de input type checkbox (caixa de opção)</h2>

    <form>
        <input type="checkbox" name="cor-fav" id="cor-azul" value="Azul">
        <label for="cor-azul">Azul</label> <br>
        <input type="checkbox" name="cor-fav" id="cor-verde" value="Verde">
        <label for="cor-verde">Verde</label> <br>
        <input type="checkbox" name="cor-fav" id="cor-rosa" value="Rosa">
        <label for="cor-rosa">Rosa</label>
    </form>


</body>
</html>
