<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Aula 10 HTML</title>
    <style>
        .test-btn {
            background-color: red;
            border: none;
            font-size: 22px;
            padding: 12px;
            border-radius: 2px;
            cursor: pointer;
            color: rgb(20, 20, 20);
            
        }
        .test-btn:hover {
            background-color: rgb(255, 112, 112);
        }
    </style>
</head>
<body>
    <!-- Utilizando botões em HTML  -->

    <h2>Exemplo de botão em HTML</h2>
    <button>Isso é um botão</button>

    <hr>

    <!-- Estilizando botão em HTML  -->

    <h2>Botão estilizado</h2>
    <button class="test-btn">Clique agora</button>

</body>
</html>
