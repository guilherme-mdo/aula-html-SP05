        /* Exemplos de links como botão */

        a:link, a:visited {
            background-color: brown;
            padding: 10px 20px;
            color: ghostwhite;
            text-decoration: none;
            font-family: sans-serif;
            font-weight: bold;
            border: 4px solid black;
            display: inline-block;
        }

        a:hover, a:active {
            background-color: bisque;
            padding: 10px 20px;
            color: black;
            text-decoration: none;
            font-family: sans-serif;
            font-weight: bold;
            border: 4px solid orchid;
            display: inline-block;
            transition: .5s;
        }

    </style>
</head>
<body>

    <!-- Exemplos de estilos em links -->
    
    <h2>Alterando estilos em links</h2>

    <h2>Usando link como botão</h2>

    <a href="###">Clique aqui</a>
