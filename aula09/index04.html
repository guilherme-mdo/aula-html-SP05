<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Aula 09</title>
</head>
<body>
    <!--Listas não ordenadas-->
    
    <h2>Trabalhando ocm listas não ordenadas</h2>

    <!--Exemplos de marcadores de lista não ordenada-->

    <ul style="list-style-type: disc;">
        <li>Laranja</li>
        <li>Manga</li>
        <li>Carambola</li>
    </ul>

    <hr>

    <ul style="list-style-type: circle;">
        <li>Café</li>
        <li>Suco</li>
        <li>Água</li>
    </ul>

    <hr>

    <ul style="list-style-type: square;">
        <li>10</li>
        <li>40</li>
        <li>70</li>
    </ul>

     <hr>

    <ul style="list-style-type: none;">
        <li>Moto</li>
        <li>Carro</li>
        <li>Avião</li>
    </ul>

<hr>

    <!-- Exemplos de listas não ordenadas alinhadas -->
    <h2>Listas alinhadas</h2>

    <ul>
        <li>Laranja</li>
        <li>Maçã</li>
        <li>Banana</li>
        <ul>
            <li>Carro</li>
            <li>Moto</li>
            <li>Barco</li>
        </ul>
        <li>Melancia</li>
        <li>Uva</li>
    </ul>



</body>
</html>
