<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Listas</title>
</head>
<body>

    <!--Definindo listas não ordenadas no HTML-->

    <h2>Exemplo de lista não ordenada em HTML (tag ul)</h2>

    <ul>
        <li>Laranja</li>
        <li>Morango</li>
        <li>Uva</li>
    </ul>

    <hr>

    <!--Definindo listas ordenadas em HTML-->

    <h2>Exemplo de lista ordenada em HTML(tag ol)</h2>

    <ol>
        <li>Tangerina</li>
        <li>Pera</li>
        <li>Maçã</li>
    </ol>

    <hr>

    <!--Definindo lista descritiva no HTML-->

    <h2>Exemplo de lista descritiva em HTML (tag dl)</h2>

    <dl>
        <dt>Café</dt>
        <dd>- Bebida quente</dd>
        <dt>Suco</dt>
        <dd>- Bebida gelada</dd>
    </dl>


    
</body>
</html>
