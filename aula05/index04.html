<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Exemplos de estilo</title>
</head>
<body style="background-color: burlywood;">
    <h1 style="background-color: darkslategray;">Exemplos de estilo em HTML</h1>

    <p style="color: orange; background-color: black;">Eu sou laranja</p>
    <p style="color: green; background-color: bisque;">Eu sou verde</p>
    <p style="font-size: 40px; background-color: yellow; color: blueviolet;">Eu sou grande</p>

    <hr>

    <p style="font-family: Arial, Helvetica, sans-serif;">Minha fonte é diferente</p>
    <p style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Minha fonte é diferente</p>
    <p style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;">Minha fonte é diferente</p>

    <hr>

    <h2 style="text-align: center;">Subtítulo centralizado</h2>
    <p style="text-align: center;">Parágrafo centralizado</p>

</body>
</html>
