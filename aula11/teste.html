<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Lâmpada</title>
</head>
<body>
    <!-- Utilizando o JavaScript para alterar atributos em HTML -->
    <h1>Exemplo de atributo alterado com JavaScript</h1>

    <p>Apenas um botão</p>

    <img id="lampada" src="lampoff.gif" width="100" height="180">

    <br><br>
    <button onclick="interruptor()">Ligar/Desligar</button>
   

    <script>
    function interruptor() {
        var img =
        document.getElementById("lampada");
        if (img.src.includes("lampoff.gif")){
            img.src = "lampon.gif";
        } else {
            img.src = "lampoff.gif";
        }

    }

</script>


</body>
</html>
