<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Aula 11 HTML</title>
</head>
<body>
    <!-- Utilizando iframe no HTML  -->

    <h2>Exemplos de iframe no HTML</h2>

    <iframe src="index.html" width="400px" height="300px" title="iframe-exemplo"></iframe>

    <hr>

    <h2>Exemplo de iframe sem borda</h2>

    <iframe src="index.html" width="400px" height="300px" title="iframe-exemplo" style="border: none;"></iframe>

    <hr>

    <h2>Exemplo de iframe com a borda estilizada</h2>

    <iframe src="index.html" width="400px" height="300px" title="iframe-exemplo" style="border: 6px solid orangered;"></iframe>

    <hr>

    <h2>Exemplo de target para iframe</h2>

    <iframe src="index.html" width="300" height="250" name="iframe-1" ></iframe>

    <br>

    <a href="https://www.netflix.com" target="iframe-1">Site da Netflix</a>

    <hr>

    <iframe
      src="https://www.google.com/maps/d/embed?mid=1uyxnw5SnPSDNnQ-AKLCAMpyoPhB-U5A&ehbc=2E312F&noprof=1"
      width="800"
      height="400"
    ></iframe>
</body>
</html>
